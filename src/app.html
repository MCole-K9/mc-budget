<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
		/>
		<script>
			// Apply the saved theme before first paint so dark mode doesn't flash light
			try {
				const stored = localStorage.getItem('theme');
				const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.setAttribute('data-theme', stored || (dark ? 'dark' : 'light'));
			} catch {
				// Storage unavailable; the theme store falls back to the system preference
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-base-200 text-base-content">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
